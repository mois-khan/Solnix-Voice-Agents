[project]
name = "solnix-voice-agents-backend"
version = "0.1.0"
description = "FastAPI backend for Solnix Voice Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1"
]
